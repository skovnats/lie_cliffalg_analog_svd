[package]
name = "lie_cliffalg_analog_svd"
version = "0.44.0"
edition = "2021"
authors = ["Lie/Clifford Analog SVD contributors...Dr. Artiom A. Kovnatsky++"]
license-file = "License"
description = "Research SVD solvers based on polar/Jacobi, Lie-Clifford dual rotors, and analog-chip rotor meshes."
repository = "https://github.com/skovnats/lie_cliffalg_analog_svd"
readme = "README.md"
keywords = ["svd", "linear-algebra", "clifford", "analog", "photonic"]
categories = ["mathematics", "science"]

[lib]
name = "lie_cliffalg_analog_svd"
path = "src/lib.rs"

[[bin]]
name = "stress_cpu"
path = "src/bin/stress_cpu.rs"

[dependencies]
ndarray = { version = "0.15", features = ["rayon"] }
num-complex = "0.4"
rand = "0.8"
rand_distr = "0.4"
rayon = "1.10"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"

[profile.bench]
opt-level = 3
lto = "fat"
codegen-units = 1
